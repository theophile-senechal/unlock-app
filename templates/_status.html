{% extends "base.html" %}
{% import '_ui.html' as ui with context %}
{% block head %}
<style>
  .status { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px calc(24px + var(--safe-b)); }
  .status__card { width: 100%; max-width: 460px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 32px 24px; text-align: center; }
  .status__icon { font-size: 2.6rem; line-height: 1; margin-bottom: 14px; }
  .status__card h1 { font-size: var(--fs-2xl); }
  .status__card p { color: var(--ink-2); margin-top: 10px; }
  .status__card .actions { display: grid; gap: 10px; margin-top: 24px; }
  .status__brand { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 24px; text-decoration: none; }
  .status__brand img { width: 28px; height: 28px; border-radius: 8px; }
  .status__brand span { font-family: var(--font-display); font-weight: 800; color: var(--brand); font-size: 1.2rem; letter-spacing: -.04em; }
  .receipt { margin-top: 18px; text-align: left; background: var(--canvas); border-radius: var(--r-md); padding: 14px 16px; font-size: var(--fs-sm); color: var(--ink-2); }
  .receipt { list-style: none; padding-left: 16px; }
  .receipt li { margin-bottom: 4px; }
</style>
{% endblock %}
{% block body %}
<main class="status">
  <div>
    <div style="text-align:center"><a class="status__brand" href="/"><img src="{{ url_for('static', filename='img/logo.svg') }}" alt=""><span>unlock</span></a></div>
    <div class="status__card">{% block card %}{% endblock %}</div>
    <footer class="site-foot">{{ ui.footer_links() }}</footer>
  </div>
</main>
{% endblock %}
