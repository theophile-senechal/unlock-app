<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNLOCK | Analytics</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bordeaux: '#6d071a',
                        'off-white': '#fdfdfb',
                        bg: '#f4f4f5'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background-color: var(--bg); 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
        }

        /* LOGO ORIGINAL EXACT */
        .logo { 
            font-weight: 800; 
            font-size: 1.4rem; 
            color: #6d071a; 
            letter-spacing: -1px; 
            line-height: 1;
        }

        /* Scrollbar masquée */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animation Barre Loader */
        @keyframes loadingTrack {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
        .progress-bar-fill {
            animation: loadingTrack 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
    </style>
</head>

<body class="h-full flex flex-col text-gray-800 bg-[#f4f4f5] overflow-y-auto overflow-x-hidden">

    <!-- ======================================================== -->
    <!--                       LOADER                             -->
    <!-- ======================================================== -->
    <div id="loader" class="fixed inset-0 bg-[#fdfdfb] z-[9999] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="flex flex-col items-center text-center px-6">
            <span class="text-3xl mb-4">📊</span>
            <div class="loader-text text-xs font-bold tracking-[0.2em] text-[#6d071a] uppercase mb-5">
                Calcul des statistiques...
            </div>
            <div class="w-48 h-1.5 bg-neutral-200/70 rounded-full overflow-hidden relative">
                <div class="progress-bar-fill absolute inset-y-0 w-20 bg-[#6d071a] rounded-full"></div>
            </div>
        </div>

        <a href="https://www.linkedin.com/in/th%C3%A9ophile-s%C3%A9n%C3%A9chal-5119181a9/" target="_blank" rel="noopener noreferrer" 
           class="absolute bottom-7 flex items-center gap-2 text-xs font-semibold text-[#6d071a]/70 hover:text-[#6d071a] transition-all">
            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
            <span>Théophile Sénéchal</span>
        </a>
    </div>

    <!-- ======================================================== -->
    <!--                       HEADER                             -->
    <!-- ======================================================== -->
    <header class="relative z-[90] bg-white border-b border-gray-200 px-5 md:px-8 py-3.5 flex items-center justify-between shadow-sm shrink-0">
        <div class="logo flex items-center gap-1.5">
            UNLOCK <span class="text-gray-400 font-medium text-lg tracking-normal">Analytics</span>
        </div>
        
        <a href="/" class="flex items-center gap-1.5 px-4 py-2 bg-gray-50 hover:bg-gray-100 border border-gray-200/80 hover:border-gray-300 text-gray-600 rounded-xl text-xs font-semibold transition shadow-sm whitespace-nowrap">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            <span class="hidden sm:inline">Retour Carte</span>
            <span class="sm:hidden">Carte</span>
        </a>
    </header>

    <!-- ======================================================== -->
    <!--                       FILTRES                            -->
    <!-- ======================================================== -->
    <div class="sticky top-0 z-[80] bg-white/80 backdrop-blur-md border-b border-gray-200/60 shadow-sm px-5 md:px-8 py-3 flex flex-col md:flex-row gap-4 md:gap-6 items-center justify-center shrink-0">
        
        <!-- Taille des blocs -->
        <div class="flex items-center justify-between w-full md:w-auto gap-3">
            <span class="text-[10px] font-bold tracking-wider text-gray-500 uppercase whitespace-nowrap">Taille</span>
            <div class="relative w-full md:w-auto">
                <select id="grid-select" onchange="loadStats()" class="w-full appearance-none bg-white border border-gray-200 text-gray-700 text-xs font-semibold py-2 pl-3 pr-8 rounded-xl shadow-sm hover:border-gray-300 focus:outline-none focus:border-[#6d071a] focus:ring-2 focus:ring-[#6d071a]/10 transition cursor-pointer min-w-[130px]">
                    <option value="100">100m / 100m</option>
                    <option value="250" selected>250m / 250m</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-gray-400">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </div>
            </div>
        </div>

        <!-- Année -->
        <div class="flex items-center justify-between w-full md:w-auto gap-3">
            <span class="text-[10px] font-bold tracking-wider text-gray-500 uppercase whitespace-nowrap">Année</span>
            <div class="relative w-full md:w-auto">
                <select id="year-select" onchange="loadStats()" class="w-full appearance-none bg-white border border-gray-200 text-gray-700 text-xs font-semibold py-2 pl-3 pr-8 rounded-xl shadow-sm hover:border-gray-300 focus:outline-none focus:border-[#6d071a] focus:ring-2 focus:ring-[#6d071a]/10 transition cursor-pointer min-w-[130px]">
                    <option value="all">Historique</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-gray-400">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </div>
            </div>
        </div>

        <!-- Sport -->
        <div class="flex items-center justify-between w-full md:w-auto gap-3">
            <span class="text-[10px] font-bold tracking-wider text-gray-500 uppercase whitespace-nowrap">Sport</span>
            <div class="relative w-full md:w-auto">
                <select id="sport-select" onchange="loadStats()" class="w-full appearance-none bg-white border border-gray-200 text-gray-700 text-xs font-semibold py-2 pl-3 pr-8 rounded-xl shadow-sm hover:border-gray-300 focus:outline-none focus:border-[#6d071a] focus:ring-2 focus:ring-[#6d071a]/10 transition cursor-pointer min-w-[130px]">
                    <option value="all">Tous sports GPS</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-gray-400">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- ======================================================== -->
    <!--                       CONTENU PRINCIPAL                  -->
    <!-- ======================================================== -->
    <main class="flex-grow w-full max-w-5xl mx-auto px-4 py-6 md:py-8 flex flex-col gap-6 mb-10">
        
        <!-- KPI Row -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
            <div class="bg-white/90 backdrop-blur-md border border-[#6d071a]/15 shadow-[0_8px_30px_rgba(109,7,26,0.06)] rounded-2xl p-6 text-center transition-transform hover:-translate-y-0.5">
                <span id="kpi-total" class="block text-4xl md:text-5xl font-extrabold text-[#6d071a] tracking-tight mb-2">-</span>
                <span class="text-[11px] font-bold tracking-wider text-gray-500 uppercase">Blocs Explorés</span>
            </div>
            
            <div class="bg-white/90 backdrop-blur-md border border-[#6d071a]/15 shadow-[0_8px_30px_rgba(109,7,26,0.06)] rounded-2xl p-6 text-center transition-transform hover:-translate-y-0.5">
                <span id="kpi-growth" class="block text-4xl md:text-5xl font-extrabold text-[#6d071a] tracking-tight mb-2">-</span>
                <span class="text-[11px] font-bold tracking-wider text-gray-500 uppercase">Moyenne / Mois</span>
            </div>
        </div>

        <!-- Chart 1 : Courbe de conquête -->
        <div class="bg-white/90 backdrop-blur-md border border-[#6d071a]/15 shadow-[0_8px_30px_rgba(109,7,26,0.06)] rounded-2xl p-5 md:p-6">
            <div class="flex items-center gap-2 mb-4">
                <span class="text-lg">📈</span>
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Courbe de découverte</h2>
            </div>
            <div class="relative h-[220px] md:h-[280px] w-full">
                <canvas id="conquestChart"></canvas>
            </div>
        </div>

        <!-- Chart 2 : Ratio -->
        <div class="bg-white/90 backdrop-blur-md border border-[#6d071a]/15 shadow-[0_8px_30px_rgba(109,7,26,0.06)] rounded-2xl p-5 md:p-6">
            <div class="flex items-center gap-2 mb-4">
                <span class="text-lg">📊</span>
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Exploration vs Routine</h2>
            </div>
            <div class="relative h-[220px] md:h-[280px] w-full">
                <canvas id="ratioChart"></canvas>
            </div>
        </div>

    </main>

    <!-- ======================================================== -->
    <!--                     LOGIQUE JAVASCRIPT                   -->
    <!-- ======================================================== -->
    <script>
        let chartConquest = null;
        let chartRatio = null;
        let filtersLoaded = false;

        const SPORT_TRANSLATIONS = {
            'Run': 'Course à pied',
            'Ride': 'Vélo',
            'Swim': 'Natation',
            'Hike': 'Randonnée',
            'Walk': 'Marche',
            'AlpineSki': 'Ski Alpin',
            'BackcountrySki': 'Ski de Rando',
            'WeightTraining': 'Musculation',
            'Workout': 'Entraînement',
            'VirtualRide': 'Vélo Virtuel',
            'VirtualRun': 'Course Virtuelle',
            'GravelRide': 'Gravel',
            'TrailRun': 'Trail',
            'E-BikeRide': 'Vélo Électrique',
            'Velomobile': 'Vélomobile',
            'NordicSki': 'Ski de Fond',
            'Snowshoe': 'Raquettes'
        };

        async function loadStats() {
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';

            const gridSize = document.getElementById('grid-select').value;
            const year = document.getElementById('year-select').value;
            const sport = document.getElementById('sport-select').value;

            try {
                const res = await fetch(`/api/stats_history?grid_size=${gridSize}&year=${year}&sport_type=${sport}`);
                const data = await res.json();

                if (!filtersLoaded || year === 'all' && sport === 'all') {
                    populateSelect('year-select', data.available_years, year, "Historique Complet");
                    populateSelect('sport-select', data.available_sports, sport, "Tous sports GPS", true);
                    filtersLoaded = true;
                }

                document.getElementById('kpi-total').textContent = data.total_blocks.toLocaleString();
                const avg = data.labels.length > 0 ? Math.round(data.total_blocks / data.labels.length) : 0;
                document.getElementById('kpi-growth').textContent = `+${avg}`;

                if (chartConquest) chartConquest.destroy();
                if (chartRatio) chartRatio.destroy();

                const ctxConquest = document.getElementById('conquestChart').getContext('2d');
                chartConquest = new Chart(ctxConquest, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: 'Territoire (Blocs)',
                            data: data.conquest,
                            borderColor: '#6d071a',
                            backgroundColor: 'rgba(109, 7, 26, 0.05)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.3,
                            pointRadius: 0,
                            pointHitRadius: 10
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
                        scales: { y: { beginAtZero: true, grid: { color: '#e5e7eb' } }, x: { grid: { display: false } } }
                    }
                });

                const ctxRatio = document.getElementById('ratioChart').getContext('2d');
                chartRatio = new Chart(ctxRatio, {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [
                            {
                                label: 'Exploration',
                                data: data.exploration,
                                backgroundColor: '#4caf50',
                                borderRadius: 4
                            },
                            {
                                label: 'Routine',
                                data: data.routine,
                                backgroundColor: '#6d071a',
                                borderRadius: 4
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { tooltip: { mode: 'index', intersect: false } },
                        scales: {
                            x: { stacked: true, grid: { display: false } },
                            y: { stacked: true, grid: { color: '#e5e7eb' } }
                        }
                    }
                });

            } catch (e) {
                console.error(e);
                alert("Erreur de chargement des statistiques");
            } finally {
                setTimeout(() => { loader.style.display = 'none'; }, 300);
            }
        }

        function populateSelect(id, items, currentValue, defaultText, translate = false) {
            const select = document.getElementById(id);
            const savedValue = select.value;
            select.innerHTML = `<option value="all">${defaultText}</option>`;
            
            items.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                if (translate && SPORT_TRANSLATIONS[item]) {
                    opt.textContent = SPORT_TRANSLATIONS[item].toUpperCase();
                } else {
                    opt.textContent = item;
                }
                select.appendChild(opt);
            });

            if (currentValue && currentValue !== 'all') {
                select.value = currentValue;
            } else if (savedValue && savedValue !== 'all') {
                 let exists = false;
                 for (let i = 0; i < select.options.length; i++) {
                     if (select.options[i].value === savedValue) exists = true;
                 }
                 if (exists) select.value = savedValue;
            } else {
                select.value = 'all';
            }
        }

        loadStats();
    </script>
</body>
</html>
